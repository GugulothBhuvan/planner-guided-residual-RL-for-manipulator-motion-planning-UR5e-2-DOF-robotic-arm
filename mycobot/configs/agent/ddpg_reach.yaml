# SPEC M10 reach: DDPG + HER, two critics, future k=4, action noise 0.1, gamma 0.98 (moves take tens of steps)
algo: ddpg
n_critics: 2
learning_rate: 1.0e-3
buffer_size: 1000000
batch_size: 256
grad_steps_per_transition: 0.5
learning_starts: 2000
gamma: 0.98
gamma_her: 0.98
tau: 0.05
net_arch: [256, 256]
action_noise: 0.1
her: {n_sampled_goal: 4, goal_selection_strategy: future}
