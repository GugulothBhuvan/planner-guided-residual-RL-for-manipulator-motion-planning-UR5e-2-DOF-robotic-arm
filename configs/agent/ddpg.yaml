# SPEC §7.1 (DDPG, if time; used by the 2-DOF PE1). Same ratio, batch and network as SAC/TD3.
algo: ddpg
learning_rate: 1.0e-3
buffer_size: 1000000
batch_size: 256
grad_steps_per_transition: 0.25
learning_starts: 2000
gamma: 0.99
gamma_her: 0.98
tau: 0.05
net_arch: [256, 256, 256]
action_noise: 0.2
her: {n_sampled_goal: 4, goal_selection_strategy: future}
